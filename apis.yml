name: Verse Enterprises
description: 'Verse, Inc. is a San Francisco-based clean energy software company, founded
  in 2022 and backed by GV (Google Ventures), that helps organizations understand, plan,
  procure, and operate clean energy portfolios. Its AI-powered platform, Aria, is modular
  and app-based, turning complex energy, market, and financial data into finance-ready
  energy intelligence so enterprises can connect to the grid faster, contain electricity
  costs and risk, and control assets across every market and hour. Verse raised a $20.5M
  Series A led by GV, with participation from Coatue, CIV, and MCJ Collective, to help
  organizations reduce electricity costs and emissions.'
